<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <link rel="shortcut icon" href="favicon.ico">
    <title>Manip Actions Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 1em;
            box-sizing: border-box;
        }
        #viewer-actions {
            font-size: 2em;
            line-height: 1.5;
            white-space: pre-wrap;
            text-align: left;
        }
        #viewer-reset {
            margin-top: 1.5em;
            font-size: 1.2em;
            padding: 0.4em 1.2em;
            cursor: pointer;
        }
        #viewer-swords {
            margin-top: 1em;
            font-size: 1.4em;
            line-height: 1.4;
            white-space: pre-wrap;
            text-align: left;
        }
        #viewer-swords .sword-header {
            font-weight: bold;
        }
        #viewer-run {
            margin-top: 0.5em;
            font-size: 1.6em;
            font-weight: bold;
            text-align: left;
        }
        #viewer-run-detail {
            font-size: 1.2em;
            text-align: left;
        }
    </style>
</head>
<body>
    <div id="viewer-actions"></div>
    <div id="viewer-run"></div>
    <div id="viewer-run-detail"></div>
    <div id="viewer-swords"></div>
    <button id="viewer-reset" type="button" title="Reset the manip page: clears the current seed, next search starts from scratch">Reset</button>

    <script type="module">
        import { rngAdv, rngInt } from './js/util.js';

        const actionsEl = document.getElementById('viewer-actions');
        const swordsEl = document.getElementById('viewer-swords');

        // Sword offsets of the current target, kept for the last-run
        // readout's nearest-offset comparison.
        let swordOffsets = [];

        const SWORD_SCAN_HORIZON = 5000;

        // Every roll distance k (0..horizon) after the post-bomb seed where a
        // beamsword would pull. A sword pull consumes two rolls from seed s:
        //   adv(s)      -> rngInt(., 128) == 0   (item pull)
        //   adv(adv(s)) -> rngInt(., 6)   == 5   (beamsword)
        // so offset k needs chain values c_{k+1} and c_{k+2}. One pass down
        // the seed chain checks every offset with a single rngAdv per step
        // (~5k advances total) instead of replaying both pull events from
        // scratch at each offset (~15k).
        function findSwordOffsets(postBombSeed, horizon) {
            const offsets = [];
            let c = rngAdv(postBombSeed);   // c_1
            let next = rngAdv(c);           // c_2
            for (let k = 0; k <= horizon; k++) {
                if (rngInt(c, 128) === 0 && rngInt(next, 6) === 5) {
                    offsets.push(k);
                }
                c = next;
                next = rngAdv(next);
            }
            return offsets;
        }

        function renderSwords(target) {
            if (!target || target.item !== 'bomb' || typeof target.postPullSeed !== 'number') {
                swordsEl.textContent = '';
                swordOffsets = [];
                return;
            }
            const offsets = findSwordOffsets(target.postPullSeed, SWORD_SCAN_HORIZON);
            swordOffsets = offsets;
            const header = `Sword seeds within ${SWORD_SCAN_HORIZON} rolls of bomb pull:`;
            const body = offsets.length
                ? offsets.map((k) => `+${k}`).join('\n')
                : '(none)';
            swordsEl.innerHTML = '';
            const h = document.createElement('div');
            h.classList.add('sword-header');
            h.textContent = header;
            const list = document.createElement('div');
            list.textContent = body;
            swordsEl.append(h, list);
        }

        document.getElementById('viewer-reset').onclick = () => {
            if (!confirm('Reset seed on the manip machine and begin new search?')) return;
            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cmd: 'reset' }),
            });
        };

        // EventSource auto-reconnects on drop, so a server restart or wifi
        // blip recovers without a page reload.
        const source = new EventSource('/api/actions/stream');

        source.onmessage = (e) => {
            const data = JSON.parse(e.data);
            actionsEl.textContent = data.text;
            renderSwords(data.target);
        };

        const runEl = document.getElementById('viewer-run');
        const runDetailEl = document.getElementById('viewer-run-detail');

        // Last completed run's consumption measurement (fed by
        // docs/js/datacollect.js at pull #3). Post-run readout only; silent
        // when that stream never sends.
        function renderRun(data) {
            if (typeof data.c !== 'number') return;
            let delta = '';
            if (swordOffsets.length) {
                const nearest = swordOffsets.reduce(
                    (m, o) => (Math.abs(o - data.c) < Math.abs(m - data.c) ? o : m),
                    swordOffsets[0]);
                const d = data.c - nearest;
                delta = ` · Δ ${d > 0 ? '+' : ''}${d} vs sword +${nearest}`;
            }
            runEl.textContent =
                `last run: C=${data.c} · est. ${data.out || '?'}${delta}`;
            runDetailEl.textContent = typeof data.mean === 'number'
                ? `n=${data.n} · mean ${data.mean.toFixed(1)}`
                    + (typeof data.sigma === 'number' ? ` · σ ${data.sigma.toFixed(1)}` : '')
                : '';
        }

        const runSource = new EventSource('/api/run/stream');
        runSource.onmessage = (e) => renderRun(JSON.parse(e.data));
    </script>
</body>
</html>

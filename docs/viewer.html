<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <link rel="shortcut icon" href="favicon.ico">
    <title>Manip Actions Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 1em;
            box-sizing: border-box;
        }
        #viewer-state {
            margin-bottom: 1.25em;
        }
        #viewer-status-line {
            font-size: 1.6em;
        }
        #viewer-recording {
            margin-top: 0.75em;
        }
        #viewer-character-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75em;
        }
        #viewer-characters {
            display: flex;
            min-height: 2.5rem;
            align-items: center;
        }
        #viewer-characters .stock-icon {
            width: 2.5rem;
            height: 2.5rem;
        }
        #viewer-character-count {
            color: #555;
        }
        #viewer-entry-controls {
            display: flex;
            gap: 0.35em;
            margin-top: 0.6em;
        }
        #viewer-entry-controls button,
        #viewer-reset {
            font-size: 1em;
            padding: 0.4em 0.9em;
            cursor: pointer;
        }
        #viewer-actions {
            font-size: 2em;
            line-height: 1.5;
            white-space: pre-wrap;
            text-align: left;
        }
        #viewer-reset {
            margin-top: 1.5em;
            background-color: #fa6c6c;
        }
        #viewer-swords {
            margin-top: 1em;
            font-size: 1.4em;
            line-height: 1.4;
            white-space: pre-wrap;
            text-align: left;
        }
        #viewer-swords .sword-header {
            font-weight: bold;
        }
        #viewer-run {
            margin-top: 0.5em;
            font-size: 1.6em;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>
<body>
    <div id="viewer-state">
        <div id="viewer-status-line" aria-live="polite">Status: <strong id="viewer-status">Connecting…</strong></div>
        <div id="viewer-recording" hidden>
            <div id="viewer-character-line">
                <div id="viewer-characters"></div>
                <span id="viewer-character-count"></span>
            </div>
            <div id="viewer-entry-controls">
                <button id="viewer-clear" type="button">Clear</button>
                <button id="viewer-undo" type="button">Undo</button>
            </div>
        </div>
    </div>
    <div id="viewer-actions"></div>
    <div id="viewer-run"></div>
    <div id="viewer-swords"></div>
    <button id="viewer-reset" type="button" title="Reset the manip page: clears the current seed, next search starts from scratch">Reset</button>

    <script type="module">
        import { rngAdv, rngInt } from './js/util.js';
        import { CHARACTER_NAMES, STOCK_ICONS } from './js/characters.js';

        const actionsEl = document.getElementById('viewer-actions');
        const swordsEl = document.getElementById('viewer-swords');
        const statusEl = document.getElementById('viewer-status');
        const recordingEl = document.getElementById('viewer-recording');
        const charactersEl = document.getElementById('viewer-characters');
        const characterCountEl = document.getElementById('viewer-character-count');
        const undoEl = document.getElementById('viewer-undo');
        const clearEl = document.getElementById('viewer-clear');

        const PHASE_LABELS = {
            recording: 'Recording characters',
            searching: 'Searching for seed',
            ready: 'Ready for run',
            running: 'Run in progress',
        };
        let previousPhase = null;

        function renderState(state) {
            if (!state || !PHASE_LABELS[state.phase]) return;
            if (state.phase === 'running' && previousPhase !== 'running') {
                lastRun = null;
            }
            previousPhase = state.phase;
            statusEl.textContent = PHASE_LABELS[state.phase];
            const recording = state.phase === 'recording';
            recordingEl.hidden = !recording;
            actionsEl.hidden = recording;
            renderRunForPhase(recording);
            if (!recording) return;

            const characters = Array.isArray(state.characters) ? state.characters : [];
            charactersEl.replaceChildren(...characters.map((index) => {
                const icon = document.createElement('img');
                icon.className = 'stock-icon';
                icon.src = STOCK_ICONS[index];
                icon.alt = CHARACTER_NAMES[index] || `Character ${index}`;
                icon.title = icon.alt;
                return icon;
            }));
            const quota = Number.isInteger(state.quota) ? state.quota : 0;
            characterCountEl.textContent = `${characters.length}/${quota}`;
            undoEl.disabled = characters.length === 0;
            clearEl.disabled = characters.length === 0;
        }

        const SWORD_SCAN_MIN = 1800;
        const SWORD_SCAN_MAX = 2400;

        // Every roll distance k in the requested range after the post-bomb seed where a
        // beamsword would pull. A sword pull consumes two rolls from seed s:
        //   adv(s)      -> rngInt(., 128) == 0   (item pull)
        //   adv(adv(s)) -> rngInt(., 6)   == 5   (beamsword)
        // so offset k needs chain values c_{k+1} and c_{k+2}. One pass down
        // the seed chain checks every offset with a single rngAdv per step
        // (~2.5k advances total) instead of replaying both pull events from
        // scratch at each offset.
        function findSwordOffsets(postBombSeed, minOffset, maxOffset) {
            const offsets = [];
            let c = rngAdv(postBombSeed);   // c_1
            let next = rngAdv(c);           // c_2
            for (let k = 0; k < minOffset; k++) {
                c = next;
                next = rngAdv(next);
            }
            for (let k = minOffset; k <= maxOffset; k++) {
                if (rngInt(c, 128) === 0 && rngInt(next, 6) === 5) {
                    offsets.push(k);
                }
                c = next;
                next = rngAdv(next);
            }
            return offsets;
        }

        function renderSwords(target) {
            if (!target || target.item !== 'bomb' || typeof target.postPullSeed !== 'number') {
                swordsEl.textContent = '';
                return;
            }
            const offsets = findSwordOffsets(
                target.postPullSeed,
                SWORD_SCAN_MIN,
                SWORD_SCAN_MAX,
            );
            const header = `Sword seeds ${SWORD_SCAN_MIN}-${SWORD_SCAN_MAX} rolls after bomb pull:`;
            const body = offsets.length
                ? offsets.map((k) => `+${k}`).join('\n')
                : '(none)';
            swordsEl.innerHTML = '';
            const h = document.createElement('div');
            h.classList.add('sword-header');
            h.textContent = header;
            const list = document.createElement('div');
            list.textContent = body;
            swordsEl.append(h, list);
        }

        function sendControl(cmd) {
            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cmd }),
            });
        }

        document.getElementById('viewer-reset').onclick = () => sendControl('reset');
        clearEl.onclick = () => sendControl('clear');
        undoEl.onclick = () => sendControl('undo');

        // EventSource auto-reconnects on drop, so a server restart or wifi
        // blip recovers without a page reload.
        const source = new EventSource('/api/actions/stream');
        let hasState = false;

        source.onmessage = (e) => {
            const data = JSON.parse(e.data);
            actionsEl.textContent = data.text;
            renderSwords(data.target);
            renderState(data.state);
            hasState = Boolean(data.state);
        };
        source.onopen = () => {
            if (!hasState) statusEl.textContent = 'Waiting for manip page';
        };
        source.onerror = () => {
            statusEl.textContent = 'Connection lost — reconnecting';
        };

        const runEl = document.getElementById('viewer-run');
        let lastRun = null;
        let recordingPhase = false;

        // Last completed run's consumption measurement (fed by
        // docs/js/datacollect.js at pull #3). Post-run readout only; silent
        // when that stream never sends.
        function renderRunForPhase(recording) {
            recordingPhase = recording;
            if (!recording || !lastRun) {
                runEl.textContent = '';
                return;
            }
            runEl.textContent = `Last run: ${lastRun.c}`;
        }

        function renderRun(data) {
            if (typeof data.c !== 'number') return;
            lastRun = data;
            renderRunForPhase(recordingPhase);
        }

        const runSource = new EventSource('/api/run/stream');
        runSource.onmessage = (e) => renderRun(JSON.parse(e.data));
    </script>
</body>
</html>

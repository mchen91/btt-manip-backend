<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
    <link rel="shortcut icon" href="favicon.ico">
    <title>SSBM RNG Manip</title>
</head>
<body>
    <div id="header-container">
        <h id="page-header">Peach RNG Manip</h>
    </div>
    <div id="settings-container">
        <p>Settings:</p>
        <div id="item-selector">
            <label>
                <input type="radio" name="item" value="beamsword" checked>
                <img src="img/beamsword.png" title="beamsword">
            </label>
            
            <label>
                <input type="radio" name="item" value="bomb">
                <img src="img/bobomb.png" title="bomb">
            </label>

            <label>
                <input type="radio" name="item" value="saturn">
                <img src="img/saturn.png" title="saturn">
            </label>
            <label>
                <input type="radio" name="item" value="hrc_stitch">
                <img src="img/stitch_and_bat.png" title="triple stitch">
            </label>
            <label id="secret">
                <input type="radio" name="item" value="targetprey">
                <img src="img/targetprey.png" title="targetprey" class="full-image">
            </label>
            <label>
                <input type="radio" name="item" value="happysquare">
                <img src="img/happysquare.png" title="happysquare" class="full-image square-image">
            </label>
        </div>
        <p id="search-count-label">Search Count: <span id="search-count">0</span></p>
        <div id="conditions-container">
            <input type="checkbox" id="mismatch-checkbox" name="aerial-spawn" value="mismatch-checkbox" onclick="toggleMismatchOptions()">
            <label for="mismatch-checkbox" onclick="toggleMismatchOptions()">Mismatch</label><br>
            <div id="mismatch-control" class="none">
                <input type="radio" id="ground-spawn" name="spawn" value="ground-spawn" checked>
                <label for="ground-spawn">Ground Spawn </label><a href="https://i.imgur.com/QLR2VAs.png" target="_blank">(spawns)</a> <br>
                <input type="radio" id="aerial-spawn" name="spawn" value="aerial-spawn">
                <label for="aerial-spawn">Aerial Spawn</label><br>  
                <input type="radio" id="luigi" name="spawn" value="luigi">
                <label for="luigi">Luigi</label><br>
                <input type="radio" id="seak" name="spawn" value="seak">
                <label for="seak">Seak</label><br>
            </div>
            
        </div>
    </div>
    <hr>
    <div id="capture-panel">
        <button id="capture-toggle" type="button">📷 Live Capture (beta) ▾</button>
        <div id="capture-body">
            <div id="capture-controls">
                <select id="capture-device" title="Video source"></select>
                <button id="capture-start" type="button">Start Camera</button>
                <button id="capture-stop" type="button" disabled>Stop</button>
            </div>
            <div id="capture-views">
                <div class="capture-view">
                    <p class="capture-view-label">Card feed (cropped in OBS)</p>
                    <canvas id="capture-raw" width="0" height="0"></canvas>
                </div>
            </div>
            <div id="capture-classify">
                <label>Detected: <strong id="capture-match">—</strong></label>
                <span class="capture-sep">|</span>
                <label>Teach template:
                    <select id="capture-char"></select>
                </label>
                <button id="capture-template" type="button">Capture template</button>
            </div>
            <div id="capture-auto">
                <label title="Automatically add each rolled character to the sequence">
                    <input type="checkbox" id="capture-auto-entry"> Auto-enter rolls
                </label>
                <label title="Run Search automatically the moment the character quota is reached (9 first search, 4 successive)">
                    <input type="checkbox" id="capture-auto-search"> Auto-search at quota
                </label>
            </div>
	    <span id="capture-auto-status" class="capture-auto-status">off</span>
            <p id="capture-status" class="capture-status"></p>
        </div>
    </div>
    <hr>
    <div id="dc-panel">
        <button id="dc-toggle" type="button">📈 Run Data — m-protocol (beta) ▾</button>
        <div id="dc-body" class="none">
            <div id="dc-controls">
                <label title="Connect to a local m-protocol daemon (127.0.0.1:43501). Passive: measurements only tune the model for future searches.">
                    <input type="checkbox" id="dc-enable"> Enable daemon connection
                </label>
                <label>Port:
                    <select id="dc-port">
                        <option value="1">P1</option>
                        <option value="2">P2</option>
                        <option value="3">P3</option>
                        <option value="4">P4</option>
                    </select>
                </label>
            </div>
            <p id="dc-conn" class="dc-line">daemon: off</p>
            <p id="dc-stats" class="dc-line"></p>
            <canvas id="dc-hist" width="260" height="48"></canvas>
            <p id="dc-status" class="dc-line"></p>
            <div>
                <button id="dc-export" type="button">Export JSON</button>
                <button id="dc-clear" type="button">Clear data</button>
            </div>
        </div>
    </div>
    <hr>
    <div id="content-container">
        <div id="character-select">
            <h3>Character Sequence</h3>
            <div id="css-container">
                <div id="css"></div>
            </div>
            <div id="char-seq-display">
                <button id="clear-button" class="control-button" onclick="clearSeq()">Clear</button>
                <div id="char-seq-container"></div>
                <button id="undo-button" class="control-button" onclick="undoChar()">Undo</button>
                <p id="character-count" class="empty-count">0/9</p>
            </div>
            <hr>
            <div id="lower-control-container">
                <button id="reset-button" class="control-button" onclick="reset()">Reset</button>
                <p class="manual-entry-label" id="manual-seed-prefix">0x</p>
                <input type="text" id="manual-seed-input" placeholder="Manual Seed Entry">
                <button id="search-button" class="control-button" onclick="searchForSeed()" disabled>Search</button>
            </div>
            
        </div>
        <div id="results-container">
            <p id="current-seed">Current Seed: <span id="seed-span" class='seed-text'></span></p>
            <div id="results">
                <p id="summary"></p>
                <p id="actions"></p>
            </div>
        </div>
    </div>
</body>

<script src="js/m-protocol.js"></script>
<script src="js/script.js" type="module"></script>
<script src="js/capture.js" type="module"></script>
<script src="js/datacollect.js" type="module"></script>
<script src="js/stream.js" type="module"></script>
</html>
